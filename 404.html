<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>404 — Page Not Found | pattagobhi.xyz</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(680px, 90%);
      padding: 48px 0;
    }

    .code {
      color: #b8f28b;
      font-size: 14px;
      letter-spacing: 4px;
    }

    h1 {
      font-size: clamp(44px, 9vw, 76px);
      line-height: 1.05;
      letter-spacing: -4px;
      margin: 24px 0;
    }

    p {
      color: #a3a3a3;
      font-size: 18px;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      color: #0a0a0a;
      background: #b8f28b;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 650;
    }

    a:hover { background: #d0ffae; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>Lost in the void.</h1>
    <p>
      This page doesn't exist. Maybe it never did.
      Either way, there's nothing to see here.
    </p>
    <a href="/">Back to the homepage ↗</a>
  </main>
</body>
</html>
